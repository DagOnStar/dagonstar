name: CI/CD

# Continuous integration on Linux (Ubuntu, Rocky Linux), macOS, Windows, and
# 64-bit Raspberry Pi OS (Debian bookworm arm64), BeeOND and scheduler-aware
# pre-staging on an emulated Slurm site, plus packaging and releases.
on:
  pull_request:
  push:
    branches:
      - master
      - main
      - development
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  quality:
    name: Quality (ruff, mypy, tutorial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install mypy==1.13.0 ruff==0.6.9
      - name: Run focused style checks
        run: python -m ruff check dagon/shell.py dagon/runtime_env.py dagon/platform_support.py dagon/beeond.py dagon/prestage.py tests tools/run_local_examples.py tools/ci_beeond_slurm.py tools/ci_prestage_slurm.py examples/dataflow/slurm/mock_scheduler.py examples/dataflow/slurm/pre_stage_mock.py examples/dataflow/slurm/pre_stage_local.py examples/dataflow/slurm/pre_stage_remote.py
      - name: Run progressive type checks
        run: python -m mypy --follow-imports=skip dagon/shell.py dagon/runtime_env.py dagon/platform_support.py dagon/beeond.py dagon/prestage.py
      - name: Validate tutorial structure and notebook
        run: |
          python tools/validate_tutorial.py
          python -c "import json; json.load(open('docs/tutorial/DAGonStar_tutorial.ipynb', encoding='utf-8'))"
      - name: Check CI shell scripts
        run: for script in tools/ci/slurm/*.sh; do bash -n "$script"; done

  # GitHub-hosted runners: Ubuntu, macOS (Apple silicon), and Windows (x64).
  test:
    name: ${{ matrix.label }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Ubuntu 24.04, os: ubuntu-24.04, python-version: "3.8" }
          - { label: Ubuntu, os: ubuntu-latest, python-version: "3.10" }
          - { label: Ubuntu, os: ubuntu-latest, python-version: "3.12" }
          - { label: Ubuntu, os: ubuntu-latest, python-version: "3.13" }
          - { label: macOS, os: macos-latest, python-version: "3.10" }
          - { label: macOS, os: macos-latest, python-version: "3.13" }
          - { label: Windows, os: windows-latest, python-version: "3.10" }
          - { label: Windows, os: windows-latest, python-version: "3.13" }
    defaults:
      run:
        # Git Bash on Windows; DAGonStar launchers also use it there.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docker,kubernetes]"
      - name: Report platform
        run: python -c "import platform, sys; from dagon.platform_support import bash_executable; print(platform.platform(), sys.version); print('bash:', bash_executable())"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile source files
        run: python -m compileall -q dagon
      - name: Run local examples
        run: python tools/run_local_examples.py

  # Rocky Linux (RHEL-compatible, common on HPC clusters) in a container.
  rocky-linux:
    name: Rocky Linux ${{ matrix.rocky }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:${{ matrix.rocky }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rocky: "9", python: "3.9", package: python3 }
          - { rocky: "9", python: "3.12", package: python3.12 }
    steps:
      - name: Install system packages
        run: dnf install -y --setopt=install_weak_deps=False git bash ${{ matrix.package }} ${{ matrix.package }}-pip
      - uses: actions/checkout@v5
      - name: Install package
        run: |
          python${{ matrix.python }} -m venv /opt/venv
          /opt/venv/bin/python -m pip install --upgrade pip
          /opt/venv/bin/python -m pip install -e ".[docker,kubernetes]"
      - name: Run unit tests
        run: /opt/venv/bin/python -m unittest discover -s tests -v
      - name: Run local examples
        run: /opt/venv/bin/python tools/run_local_examples.py

  # Raspberry Pi: 64-bit Raspberry Pi OS is Debian bookworm on arm64 (aarch64).
  raspberry-pi:
    name: Raspberry Pi OS 64-bit (Debian bookworm arm64)
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates bash python3 python3-venv python3-pip
      - uses: actions/checkout@v5
      - name: Install package
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/python -m pip install --upgrade pip
          /opt/venv/bin/python -m pip install -e ".[docker,kubernetes]"
      - name: Report platform
        run: /opt/venv/bin/python -c "import platform; print(platform.machine(), platform.platform())"
      - name: Run unit tests
        run: /opt/venv/bin/python -m unittest discover -s tests -v
      - name: Run local examples
        run: /opt/venv/bin/python tools/run_local_examples.py

  # BeeOND integration: a single-node Slurm cluster whose Prolog/Epilog emulate
  # a BeeOND site (job-private mount created at job start, destroyed at job
  # end), so per-task and per-workflow persistence run against real sbatch,
  # srun --jobid steps, and --signal time-limit warnings.  The same cluster
  # checks scheduler-aware pre-staging: stage-in before the job starts, the
  # sbatch gate on failed stage-in, and the BeeOND rejection.
  beeond-slurm:
    name: BeeOND and pre-staging on Slurm (emulated site)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Start Slurm with an emulated BeeOND site
        run: bash tools/ci/slurm/setup-slurm-beeond.sh
      - name: Run BeeOND unit tests
        run: python -m unittest tests.test_beeond -v
      - name: Run BeeOND workflows on Slurm
        run: python tools/ci_beeond_slurm.py --partition ci --scratch "$RUNNER_TEMP/beeond-scratch"
      - name: Run pre-staging unit tests
        run: python -m unittest tests.test_scheduler_prestaging tests.test_remote_scheduler_prestaging -v
      - name: Run pre-staging checks on Slurm
        run: python tools/ci_prestage_slurm.py --partition ci --scratch "$RUNNER_TEMP/prestage-scratch"
      - name: Run the pre-staging example on Slurm
        run: python examples/dataflow/slurm/pre_stage_local.py --partition ci --scratch "$RUNNER_TEMP/prestage-example"
      - name: Show Slurm and site logs
        if: failure()
        run: |
          sinfo || true
          squeue || true
          sacct -X 2>/dev/null || true
          sudo cat /var/log/slurm/beeond-ci.log || true
          sudo tail -n 100 /var/log/slurm/slurmctld.log /var/log/slurm/slurmd.log || true
          find "$RUNNER_TEMP/prestage-scratch" "$RUNNER_TEMP/prestage-example" -maxdepth 4 -path '*/.dagon/*' \( -name 'stage_in.sh' -o -name 'stage-in-complete.json' -o -name 'allocation_started_at' \) -print -exec tail -n 40 {} \; || true
          find "$RUNNER_TEMP/beeond-scratch" -maxdepth 6 \( -name '*.out' -o -name '*.err' -o -name 'beeond_persist.status' -o -name 'holder-*.out' \) -print -exec tail -n 40 {} \; || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: beeond-slurm-scratch
          path: ${{ runner.temp }}/beeond-scratch
          if-no-files-found: ignore

  # Continuous delivery: build and check the distributions on every run.
  build:
    name: Build distributions
    needs: [quality, test, rocky-linux, raspberry-pi, beeond-slurm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import configparser; c = configparser.ConfigParser(); c.read('setup.cfg'); print(c['metadata']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match setup.cfg version ${version}"; exit 1; }
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/python -c "import dagon, dagon.web, dagon.fair, dagon.iot, dagon.stager, dagon.platform_support; print('wheel import ok')"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # On a version tag (vX.Y.Z), attach the distributions to a GitHub release.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag

  # Opt-in PyPI publishing via trusted publishing (no stored token). Enable by
  # configuring a PyPI trusted publisher for this workflow and the "pypi"
  # environment, then setting the repository variable PYPI_PUBLISH=true.
  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
